<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reflection of Light</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: transparent;
      color: black;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 18px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 52px);
      text-align: center;
      color: black;
    }

    .canvas-wrapper {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      text-align: center;
      padding: 0 10px;
    }

    .controls label {
      font-size: clamp(16px, 2vw, 24px);
      width: 100%;
    }

    input[type="range"] {
      width: min(500px, 90vw);
      margin-top: 12px;
    }

    .value {
      display: inline-block;
      margin-top: 8px;
      font-weight: bold;
      font-size: clamp(18px, 3vw, 28px);
      color: #ffe600;
    }

    .law {
      text-align: center;
      font-size: clamp(16px, 2.5vw, 28px);
      padding: 10px 16px;
      line-height: 1.5;
    }

    .yellow {
      color: #ffe600;
    }

    .cyan {
      color: #00e5ff;
    }

    @media (max-width: 768px) {

      .container {
        padding: 12px;
        gap: 14px;
      }

      .canvas-wrapper {
        aspect-ratio: 1/1;
      }

      h1 {
        font-size: 30px;
      }

      .controls label {
        font-size: 18px;
      }

      .law {
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {

      .canvas-wrapper {
        aspect-ratio: 1/1.1;
      }

      h1 {
        font-size: 24px;
      }

      .controls label {
        font-size: 16px;
      }

      .law {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Reflection of Light</h1>

    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">

      <label>
        Angle of Incidence
        <br>

        <input type="range" id="slider" min="10" max="80" value="40">

        <br>

        <span class="value" id="value">40°</span>

      </label>

    </div>

    <div class="law">
      According to the law of reflection:
      <span class="yellow">∠i</span>
      =
      <span class="cyan">∠r</span>
    </div>

  </div>

  <script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("slider");
    const value = document.getElementById("value");

    let progress = 0;
    let animationRunning = false;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      drawFrame(2.4);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();

    function startAnimation() {

      progress = 0;
      animationRunning = true;

      animate();
    }

    function animate() {

      if (!animationRunning) return;

      drawFrame(progress);

      progress += 0.02;

      // STOP AFTER ONE COMPLETE RUN
      if (progress >= 2.4) {

        progress = 2.4;
        drawFrame(progress);

        animationRunning = false;
        return;
      }

      requestAnimationFrame(animate);
    }

    function drawFrame(progressValue) {

      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      const centerX = w / 2;
      const mirrorY = h * 0.72;

      const angleDeg = parseInt(slider.value);
      const angleRad = angleDeg * Math.PI / 180;

      const rayLength = Math.min(w, h) * 0.42;

      // Mirror
      drawMirror(w, mirrorY);

      // Normal Line
      ctx.setLineDash([8, 8]);

      ctx.strokeStyle = "black";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(centerX, h * 0.12);
      ctx.lineTo(centerX, h * 0.85);
      ctx.stroke();

      ctx.setLineDash([]);

      ctx.fillStyle = "black";
      ctx.font = `${Math.max(14, w * 0.018)}px Arial`;
      ctx.fillText("Normal", centerX - 25, h * 0.1);

      // Coordinates

      const ix = centerX - rayLength * Math.sin(angleRad);
      const iy = mirrorY - rayLength * Math.cos(angleRad);

      const rx = centerX + rayLength * Math.sin(angleRad);
      const ry = mirrorY - rayLength * Math.cos(angleRad);

      // INCIDENT RAY

      if (progressValue <= 1) {

        const px = lerp(ix, centerX, progressValue);
        const py = lerp(iy, mirrorY, progressValue);

        drawGlowLine(ix, iy, px, py, "#ff4040");
        drawArrow(ix, iy, centerX, mirrorY, "#ff4040");

      } else {

        drawGlowLine(ix, iy, centerX, mirrorY, "#ff4040");
        drawArrow(ix, iy, centerX, mirrorY, "#ff4040");

        // REFLECTED RAY

        const t = Math.min(progressValue - 1, 1);

        const px = lerp(centerX, rx, t);
        const py = lerp(mirrorY, ry, t);

        drawGlowLine(centerX, mirrorY, px, py, "#6dff5f");
        drawArrow(centerX, mirrorY, rx, ry, "#6dff5f");

        if (progressValue >= 2) {
          drawAngles(centerX, mirrorY, angleRad, w, h, angleDeg);
        }
      }

      // Labels

      ctx.font = `${Math.max(14, w * 0.02)}px Arial`;

      ctx.fillStyle = "#ff4040";
      ctx.fillText("Incident Ray", ix - 40, iy - 10);

      ctx.fillStyle = "#6dff5f";
      ctx.fillText("Reflected Ray", rx - 20, ry - 10);

      // Point

      ctx.fillStyle = "black";

      ctx.beginPath();
      ctx.arc(centerX, mirrorY, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMirror(w, mirrorY) {

      ctx.fillStyle = "#999";

      ctx.fillRect(w * 0.12, mirrorY - 8, w * 0.76, 16);

      ctx.strokeStyle = "rgba(0,0,0,0)";
      ctx.lineWidth = 1;

      for (let i = 0; i < 50; i++) {

        const x = w * 0.12 + i * 18;

        ctx.beginPath();
        ctx.moveTo(x, mirrorY + 7);
        ctx.lineTo(x + 10, mirrorY - 7);
        ctx.stroke();
      }

      ctx.fillStyle = "black";
      ctx.font = `${Math.max(12, w * 0.016)}px Arial`;
      ctx.fillText("Mirror", w / 2 - 22, mirrorY + 32);
    }

    function drawGlowLine(x1, y1, x2, y2, color) {

      ctx.strokeStyle = color;

      ctx.globalAlpha = 0.2;
      ctx.lineWidth = 10;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawArrow(x1, y1, x2, y2, color) {

      const angle = Math.atan2(y2 - y1, x2 - x1);

      const arrowX = x1 + 55 * Math.cos(angle);
      const arrowY = y1 + 55 * Math.sin(angle);

      const head = 12;

      ctx.fillStyle = color;

      ctx.beginPath();

      ctx.moveTo(arrowX, arrowY);

      ctx.lineTo(
        arrowX - head * Math.cos(angle - Math.PI / 6),
        arrowY - head * Math.sin(angle - Math.PI / 6)
      );

      ctx.lineTo(
        arrowX - head * Math.cos(angle + Math.PI / 6),
        arrowY - head * Math.sin(angle + Math.PI / 6)
      );

      ctx.closePath();
      ctx.fill();
    }

    function drawAngles(centerX, mirrorY, angleRad, w, h, angleDeg) {

      const r1 = Math.min(w, h) * 0.08;
      const r2 = r1 + 20;

      ctx.strokeStyle = "#ffcc00";
      ctx.lineWidth = 3;

      ctx.beginPath();

      ctx.arc(
        centerX,
        mirrorY,
        r1,
        -Math.PI / 2 - angleRad,
        -Math.PI / 2,
        false
      );

      ctx.stroke();

      ctx.strokeStyle = "#00b7ff";

      ctx.beginPath();

      ctx.arc(
        centerX,
        mirrorY,
        r2,
        -Math.PI / 2,
        -Math.PI / 2 + angleRad,
        false
      );

      ctx.stroke();

      ctx.font = `${Math.max(12, w * 0.018)}px Arial`;

      ctx.fillStyle = "#ffcc00";

      ctx.fillText(`∠i`, centerX - r1 - 10, mirrorY - r1 - 5);
      ctx.fillText(`${angleDeg}°`, centerX - r1 - 10, mirrorY - r1 + 18);

      ctx.fillStyle = "#00b7ff";

      ctx.fillText(`∠r`, centerX + r1 + 10, mirrorY - r1 - 5);
      ctx.fillText(`${angleDeg}°`, centerX + r1 + 10, mirrorY - r1 + 18);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    slider.addEventListener("input", () => {

      value.innerText = slider.value + "°";

      startAnimation();
    });

    // Initial Draw (STATIC)
    drawFrame(2.4);

  </script>

</body>

</html>
