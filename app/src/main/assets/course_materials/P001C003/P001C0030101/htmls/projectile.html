<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projectile Motion Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
      color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 0 10px 16px 10px;
    }

    canvas {
      background: transparent;
      cursor: pointer;
      display: block;
      width: min(100%, 900px);
      height: auto;
      margin-bottom: 0;
    }

    .controls {
      width: min(100%, 900px);
      margin-top: 10px;
      padding: 0 4px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .control-text {
      width: 100%;
      text-align: center;
    }

    .slider-wrap {
      flex: 1;
      width: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-value {
      min-width: 74px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #1f4b99;
      background: #e8f0ff;
      border: 1px solid #cdddfc;
      padding: 7px 10px;
      border-radius: 10px;
      line-height: 1.1;
    }

    #fireBtn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: 0.2s ease;
    }

    #fireBtn:hover {
      background: #e64a19;
      transform: scale(1.03);
    }

    input[type="range"] {
      width: 50%;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      background: linear-gradient(90deg, #d8e3f8, #bad0ff);
      border-radius: 999px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #2563eb;
      margin-top: -6.5px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      background: linear-gradient(90deg, #d8e3f8, #bad0ff);
      border-radius: 999px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .control-label {
        font-size: 16px;
        gap: 8px;
      }

      .control-text {
        min-width: 100%;
      }

      .slider-wrap {
        width: 50%;
        min-width: 50%;
      }

      .control-value {
        min-width: 68px;
        font-size: 15px;
        padding: 6px 8px;
      }

      #fireBtn {
        padding: 9px 18px;
        font-size: 15px;
        border-radius: 18px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0 6px 14px 6px;
      }

      .controls {
        padding: 0 2px;
      }

      .control-group {
        margin-bottom: 14px;
      }

      .control-label {
        font-size: 15px;
      }

      .control-value {
        min-width: 62px;
        font-size: 14px;
        padding: 6px 7px;
        border-radius: 9px;
      }

      #fireBtn {
        padding: 8px 16px;
        font-size: 14px;
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        margin-top: -5.5px;
      }

      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>

<canvas id="canvas" width="900" height="680"></canvas>

<div class="controls">
  <div class="control-group">
    <div class="control-label">
      <button style="margin-bottom: 10px;" id="fireBtn">Fire</button>
    </div>
  </div>

  <div class="control-group">
    <div class="control-label">
      <span class="control-text">Angle Of Projection (θ):</span>
      <div class="slider-wrap">
        <input type="range" id="angleSlider" min="0" max="90" value="30">
        <span style="margin-left: 20px;" class="control-value" id="angleDisplay">30°</span>
      </div>

    </div>
  </div>

  <div class="control-group">
    <div class="control-label">
      <span class="control-text">Initial Velocity (u):</span>
      <div class="slider-wrap">
        <input type="range" id="speedSlider" min="2" max="40" value="14">
        <span style="margin-left: 20px;" class="control-value" id="speedDisplay">14 m/s</span>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const slider = document.getElementById("angleSlider");
  const display = document.getElementById("angleDisplay");

  const speedSlider = document.getElementById("speedSlider");
  const speedDisplay = document.getElementById("speedDisplay");

  const fireBtn = document.getElementById("fireBtn");

  const cannonImg = new Image();
  cannonImg.src = "html_assets/cannon.svg";

  const targetImg = new Image();
  targetImg.src = "html_assets/target.svg";

  const ballImg = new Image();
  ballImg.src = "html_assets/cannon_ball_croped.png";

  const sceneShiftY = 140;
  const anchor = { x: 60, y: 400 + sceneShiftY };

  const target = {
    x: 750,
    y: 330 + sceneShiftY,
    size: 100
  };

  let ball = null;

  let launchX = null;
  let finalDistanceX = null;
  let showDistanceLine = false;

  let maxHeightY = null;
  let showHeightLine = false;
  let heightLineX = null;

  let trajectoryPoints = [];
  let showTrajectory = false;

  const groundY = anchor.y + 12;

  const GRAVITY = 9.8;
  const PX_PER_METER = 6;
  const TIME_STEP = 1 / 60;
  const ANIMATION_SPEED = 2.5;
  const EFFECTIVE_TIME_STEP = TIME_STEP * ANIMATION_SPEED;
  const BALL_RADIUS = 10;
  const cannonImageRotationOffset = 0.28;

  function draw(angleDeg) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    const angleRad = angleDeg * Math.PI / 180;
    const launchRotation = -angleRad;
    const cannonDrawRotation = launchRotation + cannonImageRotationOffset;

    ctx.drawImage(targetImg, target.x, target.y, 180, 120);

    if (showTrajectory && trajectoryPoints.length > 1) {
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(trajectoryPoints[0].x, trajectoryPoints[0].y);

      for (let i = 1; i < trajectoryPoints.length; i++) {
        ctx.lineTo(trajectoryPoints[i].x, trajectoryPoints[i].y);
      }

      ctx.stroke();
      ctx.restore();
    }

    if (showDistanceLine && launchX !== null && finalDistanceX !== null) {
      const leftX = Math.min(launchX, finalDistanceX);
      const rightX = Math.max(launchX, finalDistanceX);
      const midX = (leftX + rightX) / 2;
      const y = groundY + 30;

      ctx.save();

      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(leftX, y);
      ctx.lineTo(rightX, y);
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(leftX, y - 22);
      ctx.lineTo(leftX, y + 22);
      ctx.moveTo(rightX, y - 22);
      ctx.lineTo(rightX, y + 22);
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.moveTo(leftX, y);
      ctx.lineTo(leftX + 16, y - 10);
      ctx.lineTo(leftX + 16, y + 10);
      ctx.closePath();
      ctx.fillStyle = "#777";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(rightX, y);
      ctx.lineTo(rightX - 16, y - 10);
      ctx.lineTo(rightX - 16, y + 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.font = "italic 42px serif";
      ctx.textAlign = "center";
      ctx.fillText("d", midX, y + 48);

      const horizontalDistanceMeters = Math.abs(finalDistanceX - launchX) / PX_PER_METER;
      ctx.font = "16px Arial";
      ctx.fillText(`${horizontalDistanceMeters.toFixed(2)} m`, midX, y + 75);

      ctx.restore();
    }

    if (showHeightLine && maxHeightY !== null && heightLineX !== null) {
      const topY = maxHeightY;
      const bottomY = groundY;
      const midY = (topY + bottomY) / 2;
      const x = heightLineX;

      ctx.save();

      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(x, topY);
      ctx.lineTo(x, bottomY);
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 22, topY);
      ctx.lineTo(x + 22, topY);
      ctx.moveTo(x - 22, bottomY);
      ctx.lineTo(x + 22, bottomY);
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.moveTo(x, topY);
      ctx.lineTo(x - 10, topY + 16);
      ctx.lineTo(x + 10, topY + 16);
      ctx.closePath();
      ctx.fillStyle = "#777";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x, bottomY);
      ctx.lineTo(x - 10, bottomY - 16);
      ctx.lineTo(x + 10, bottomY - 16);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.font = "italic 42px serif";
      ctx.textAlign = "center";
      ctx.fillText("h", x + 35, midY + 10);

      const verticalHeightMeters = Math.abs(bottomY - topY) / PX_PER_METER;
      ctx.font = "16px Arial";
      ctx.fillText(`${verticalHeightMeters.toFixed(2)} m`, x + 45, midY + 35);

      ctx.restore();
    }

    if (ball) {
      ctx.drawImage(
        ballImg,
        ball.x - BALL_RADIUS,
        ball.y - BALL_RADIUS,
        BALL_RADIUS * 2,
        BALL_RADIUS * 2
      );
    }

    ctx.save();
    ctx.translate(anchor.x, anchor.y);
    ctx.rotate(cannonDrawRotation);
    ctx.drawImage(cannonImg, -114, -104, 240, 160);
    ctx.restore();
  }

  function updateAngle(value) {
    value = Math.max(0, Math.min(90, Number(value)));
    slider.value = value;
    display.textContent = value + "°";
  }

  function updateSpeed(value) {
    value = Math.max(2, Math.min(40, Number(value)));
    speedSlider.value = value;
    speedDisplay.textContent = value + " m/s";
  }

  function fire() {
    showDistanceLine = false;
    finalDistanceX = null;
    showHeightLine = false;
    maxHeightY = null;
    heightLineX = null;

    trajectoryPoints = [];
    showTrajectory = true;

    const angleDeg = Number(slider.value);
    const angleRad = angleDeg * Math.PI / 180;
    const launchRotation = -angleRad;

    const muzzleLength = 90;
    const muzzleOffsetY = -18;

    const muzzleX =
      anchor.x +
      Math.cos(launchRotation) * muzzleLength -
      Math.sin(launchRotation) * muzzleOffsetY;

    const muzzleY =
      anchor.y +
      Math.sin(launchRotation) * muzzleLength +
      Math.cos(launchRotation) * muzzleOffsetY;

    const speed = Number(speedSlider.value);

    ball = {
      x: muzzleX,
      y: muzzleY,
      vx: Math.cos(angleRad) * speed,
      vy: -Math.sin(angleRad) * speed
    };

    launchX = muzzleX;
    maxHeightY = muzzleY;
    heightLineX = muzzleX + 25;

    trajectoryPoints.push({ x: muzzleX, y: muzzleY });
  }

  function updateBall() {
    if (!ball) return;

    ball.x += ball.vx * EFFECTIVE_TIME_STEP * PX_PER_METER;
    ball.y += ball.vy * EFFECTIVE_TIME_STEP * PX_PER_METER;
    ball.vy += GRAVITY * EFFECTIVE_TIME_STEP;

    trajectoryPoints.push({ x: ball.x, y: ball.y });

    if (maxHeightY === null || ball.y < maxHeightY) {
      maxHeightY = ball.y;
      heightLineX = ball.x + 25;
    }

    if (ball.y >= groundY - BALL_RADIUS) {
      ball.y = groundY - BALL_RADIUS;
      trajectoryPoints.push({ x: ball.x, y: ball.y });

      finalDistanceX = ball.x;
      showDistanceLine = true;
      showHeightLine = true;
      ball = null;
    }
  }

  function animate() {
    updateBall();
    draw(Number(slider.value));
    requestAnimationFrame(animate);
  }

  slider.addEventListener("input", (e) => updateAngle(e.target.value));
  speedSlider.addEventListener("input", (e) => updateSpeed(e.target.value));
  fireBtn.addEventListener("click", fire);
  canvas.addEventListener("click", fire);

  let loaded = 0;
  function onLoad() {
    loaded++;
    if (loaded === 3) {
      updateAngle(30);
      updateSpeed(14);
      animate();
    }
  }

  cannonImg.onload = onLoad;
  targetImg.onload = onLoad;
  ballImg.onload = onLoad;
</script>

</body>
</html>
